<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEX.DEV - Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #090a0f;
            --bg-card: rgba(18, 22, 33, 0.75);
            --accent-purple: #7928ca;
            --accent-blue: #0070f3;
            --accent-cyan: #00dfd8;
            --accent-gradient: linear-gradient(135deg, #7928ca 0%, #0070f3 50%, #00dfd8 100%);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
            --glow: 0 0 35px rgba(121, 40, 202, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 30%, rgba(121, 40, 202, 0.15) 0%, transparent 50%), radial-gradient(circle at 80% 80%, rgba(0, 112, 243, 0.15) 0%, transparent 50%);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

            .logo span {
                background: var(--accent-gradient);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }

        .login-subtitle {
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
            font-size: 16px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

            .form-input:focus {
                border-color: var(--accent-blue);
                background: rgba(255, 255, 255, 0.05);
                box-shadow: 0 0 15px rgba(0, 112, 243, 0.2);
            }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .forgot-pass {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 500;
        }

            .forgot-pass:hover {
                text-decoration: underline;
            }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border-radius: 50px;
            background: var(--accent-gradient);
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            border: none;
            cursor: pointer;
            box-shadow: var(--glow);
            transition: all 0.3s ease;
        }

            .btn-submit:hover {
                transform: translateY(-2px);
                box-shadow: 0 0 40px rgba(121, 40, 202, 0.5);
            }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-muted);
        }

            .login-footer a {
                color: #fff;
                text-decoration: none;
                font-weight: 600;
            }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-shield-halved" style="color: var(--accent-blue);"></i>
                ALEX<span>.ADMIN</span>
            </a>
            <p class="login-subtitle">Hoş geldiniz, devam etmek için giriş yapın.</p>
        </div>

        <form action="admin-dashboard.html">
            <div class="form-group">
                <label class="form-label">E-Posta veya Kullanıcı Adı</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="text" class="form-input" placeholder="admin@alex.dev" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Şifre</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" class="form-input" placeholder="••••••••" required>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox"> Beni Hatırla
                </label>
                <a href="#" class="forgot-pass">Şifremi Unuttum</a>
            </div>

            <button type="submit" class="btn-submit">
                Giriş Yap <i class="fa-solid fa-arrow-right" style="margin-left: 8px;"></i>
            </button>
        </form>

        <div class="login-footer">
            <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Ana Sayfaya Dön</a>
        </div>
    </div>

</body>
</html>
